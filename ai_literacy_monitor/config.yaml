# AI Literacy Monitor — Configuration
# Copy this file and adjust paths/addresses for your environment.
# Secrets (API keys, SMTP password) go in .env — never here.

feeds:
  # Google Alerts RSS — set up alerts at https://www.google.com/alerts
  # Search: "AI literacy" pedagogy  → copy the RSS URL here
  - name: "Google Alerts — AI literacy pedagogy"
    url: "https://www.google.com/alerts/feeds/00086923709683272338/12088656225651964488"
    category: "scholar"

  # Inside Higher Ed
  - name: "Inside Higher Ed"
    url: "https://www.insidehighered.com/rss.xml"
    category: "news"

  # The Chronicle of Higher Education
  - name: "Chronicle of Higher Education"
    url: "https://www.chronicle.com/index.atom"
    category: "news"

  # EdSurge
  - name: "EdSurge"
    url: "https://www.edsurge.com/articles_rss"
    category: "news"

  # EDUCAUSE Review
  - name: "EDUCAUSE"
    url: "https://er.educause.edu/rss"
    category: "news"

output:
  # Local path — mount SharePoint as a network drive and point here,
  # or use any directory. Created automatically if absent.
  directory: "./reports"

  # Fallback local directory used when SharePoint is unavailable
  fallback_directory: "./reports"


claude:
  model: "claude-opus-4-6"
  max_tokens: 1024
  # Keywords used to pre-filter feed items before sending to Claude.
  # Items whose title or summary contain none of these are skipped.
  filter_keywords:
    - "AI literacy"
    - "artificial intelligence"
    - "generative AI"
    - "machine learning"
    - "ChatGPT"
    - "large language model"
    - "LLM"
    - "pedagogy"
    - "higher education"
    - "teaching"
    - "ethics"

report:
  max_bullets: 15
  min_bullets: 5

state:
  # Tracks seen item IDs across runs to deduplicate.
  seen_file: "./state/seen_items.json"
  # Items older than this many days are pruned from the seen list.
  max_age_days: 30
